# Available values:
# - local_no_clearml: run locally without creating a ClearML task
# - local_clearml: run locally and log metrics/artifacts to ClearML
# - remote_clearml: run through a ClearML agent on the selected queue
run_mode: remote_clearml

clearml:
  project_name: Custom/MNIST
  task_name: BWResNet18_Training
  queue_name: 1xGPU
  docker_image: ""
  docker_arguments: --ipc=host --gpus all

data:
  local_dataset_path: ""
  dataset_id: df6e95d13caf49dabffaa66070c3ce59

model:
  local_weights_path: ""
  clearml_model_id: ""  # optional: download this ClearML model and use it as the initial checkpoint

inference:
  split: validation
  batch_size: 64
  num_workers: 2
  run_mode: "remote_clearml"  # optional override: local_no_clearml, local_clearml, or remote_clearml; empty uses top-level run_mode
  task_name: BWResNet18_Inference

training:
  batch_size: 64
  num_epochs: 5
  lr: 0.001
  momentum: 0.9
  resume_training: False
  resume_task_id: ""  # optional: use a specific ClearML task id as the resume source
  num_workers: 2
  image_size: 224
  mean: 0.5
  std: 0.5
  pretrained: true
  hid_lay_size: 100
  dropout: 0.1
  artifacts_dir: artifacts
